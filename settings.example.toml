transmit = false
rf_to_is = true
no_gate_me = false
is_to_rf = true
beacon = true
beacon_path = "WIDE1-1,WIDE2-1"
message_path = "WIDE1-1"
messages = true
objects = true
digipeater = false
digi_outputs = []
digi_transforms = ["WIDE1-1="]
gate_calls = []
gate_objects = []
passall = false
open_commands = []
close_commands = []
command_prompt = "cmd:"
command_timeout_ms = 3000
command_delay_ms = 100
reconnect_seconds = 3
transmit_per_minute = 20
minimum_transmit_ms = 1000
kiss_txdelay = -1
kiss_persistence = -1
kiss_slot = -1
kiss_tail = -1
kiss_duplex = -1

