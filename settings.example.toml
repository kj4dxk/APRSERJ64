port = 14580

[[aprs.servers]]
name = "China — china.aprs2.net"
host = "china.aprs2.net"
port = 14580

[beacon]
internet = true
radio = true
enabled = true
minimum_seconds = 10
maximum_seconds = 1800
time_only = false
start_stop = true
heading_degrees = 30
forecast_error_meters = 160.9344
distance_meters = 1609.344
moving_knots = 0.5
on_reconnect = true
on_gps_change = true
recenter_after_transmit = false
symbol_table = "/"
symbol = "-"
timestamp = "hms"
compressed = false
course_speed = true
altitude = true
precision = 0
messaging = true
include_reason = false
status_tag = ""
comments = ["APRSIS64"]
comment_enabled = true
comment_interval_seconds = 0
rotate_comments = false
selected_comment = 0

[position]
port_name = ""
source = "fixed"
latitude = 28.536725
longitude = -81.242932
altitude_meters = 0
gps_endpoint = "127.0.0.1:10110"
gpsd_endpoint = "127.0.0.1:2947"
serial_port = ""
serial_baud = 4800
maximum_age_seconds = 30
maximum_accuracy_meters = 100

[status]
enabled = false
interval_seconds = 1800
timestamp = true
grid = false
text = "APRSIS64"

[odometer]
report_on_exit = false

[radio]
heard_seconds = 1800
maximum_hops = 2
duplicate_seconds = 30
internet_seconds = 1800
maximum_entries = 4096

# Configure the device/endpoint, then enable this port.
