# First-run defaults copied from APRSERJa. Runtime values live in settings.toml.
[map]
source_name = "pdeffenb"
project_preset_url = "http://pdeffenb.homeip.net:82/raster/light/{z}/{x}/{y}.png"
osm_preset_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
tile_url = "http://pdeffenb.homeip.net:82/raster/light/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap contributors"
attribution_url = "https://www.openstreetmap.org/copyright"
tile_size = 256
minimum_zoom = 0
maximum_zoom = 18
initial_zoom = 12.0
cache_megabytes = 512
maximum_fps = 30
online_enabled = true
base_opacity = 1.0
overlay_enabled = false
overlay_url = ""
overlay_opacity = 0.5
underlay_enabled = false
underlay_url = ""

[services]
satellite_status_url = "https://www.ariss.org/current-status-of-iss-stations.html"
base_url = "http://pdeffenb.homeip.net:82"
routing_url = "http://pdeffenb.homeip.net:82/osmand/route/v1/"
search_url = "http://pdeffenb.homeip.net:82/api/search"
map_page_url = "http://pdeffenb.homeip.net:82/raster.html"
setup_url = "http://pdeffenb.homeip.net:82/osmand-setup.html"
monitor_url = "http://pdeffenb.homeip.net:82/monitor.html"
source_url = "https://github.com/kj4dxk/APRSERJ64"
legacy_wiki_url = "https://aprsisce.wikidot.com/"
legacy_manual_url = "https://kj4dxk.github.io/APRSIS32/"
manual_url = "https://github.com/kj4dxk/APRSERJ64/blob/codex/aprs-symbol-vectors/docs/index.md"
credits_url = "https://github.com/kj4dxk/APRSERJ64/blob/codex/aprs-symbol-vectors/docs/reference/credits.md"
foundation_url = "https://www.aprsfoundation.org/"
foundation_github_url = "https://github.com/APRSFoundation"
foundation_legacy_url = "https://github.com/APRSFoundation/APRSISCE"
legacy_source_url = "https://github.com/kj4dxk/APRSIS32"
passcode_help_url = "https://github.com/kj4dxk/APRSIS32/blob/main/docs/manual/doc-passcode.md"
passcode_request_email = "APRSISCE+owner@groups.io"

[gps_defaults]
tcp_endpoint = "127.0.0.1:10110"
gpsd_endpoint = "127.0.0.1:2947"
