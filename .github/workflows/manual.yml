name: User manual
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/manual_*.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'settings.example.toml'
      - 'src/main/kotlin/org/aprserj64/*Preferences.kt'
      - 'src/main/kotlin/org/aprserj64/ObjectGeometry.kt'
      - '.github/workflows/manual.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/manual_*.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'settings.example.toml'
      - 'src/main/kotlin/org/aprserj64/*Preferences.kt'
      - 'src/main/kotlin/org/aprserj64/ObjectGeometry.kt'
      - '.github/workflows/manual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/manual_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: APRSERJ64-manual
          path: |
            build/APRSERJ64-manual.html
            build/manual-site/
