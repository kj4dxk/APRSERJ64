site_name: APRSERJ64 manual
site_description: Task-based user guide and configuration reference for APRSERJ64
repo_url: https://github.com/kj4dxk/APRSERJ64
edit_uri: edit/main/docs/
site_dir: build/manual-site
use_directory_urls: false
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - Manual: index.md
  - Getting started:
      - First connection: start/quick-start.md
      - Main window: start/workspace.md
      - Moving from APRSIS32: start/from-aprsis32.md
  - Everyday operation:
      - Maps and offline use: operate/maps.md
      - Conversations: operate/messages.md
      - Groups and messaging services: operate/services.md
      - Position and beaconing: operate/beacons.md
      - Objects and QRU: operate/objects.md
  - Devices and routing:
      - Set up ports: connect/ports.md
      - IGate and digipeater wiring: connect/routing.md
      - Local network services: connect/local-services.md
  - Operating tools:
      - Weather: tools/weather.md
      - Telemetry: tools/telemetry.md
      - Tracks and GPX: tools/tracks.md
      - Satellites and GPS sky: tools/satellites.md
      - Digital-mode imports: tools/digital.md
  - Reference:
      - Topic index and glossary: reference/index.md
      - Control locator: reference/controls.md
      - Settings catalog: reference/settings.md
      - Port fields: reference/ports.md
      - Object fields: reference/objects.md
      - Filters: reference/filters.md
      - Query responses: reference/queries.md
      - Files and updates: reference/files.md
      - Compatibility and limits: reference/compatibility.md
      - Sources and credits: reference/credits.md
      - Maintain the manual: reference/maintaining.md
  - Troubleshooting: help/troubleshooting.md
